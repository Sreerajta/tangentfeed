name: tangentfeed_example
description: "Two-peer sync demo: run it twice, or against the browser demo."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  tangentfeed: ^0.1.0
  tangentfeed_flutter:
    path: ..

# Neither package is on pub.dev yet, so the whole tree resolves from source.
# Overrides only take effect in the root package, which is why this repeats
# what tangentfeed_flutter already declares for itself.
dependency_overrides:
  tangentfeed:
    path: ../../dart
  tangentfeed_flutter:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
